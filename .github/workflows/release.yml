name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Caching is disabled deliberately. This workflow runs on tags and
          # publishes the release artifacts, so a cache entry written by an
          # earlier pull request run must not be able to influence what ships.
          # A one-off release build gains little from the cache. Note that
          # `cache:` alone does not disable caching, because
          # `package-manager-cache` defaults to true.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run ci

      - name: Generate release notes
        run: npm run release:notes

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # `gh` ships with the runner, so publishing needs no third-party action.
      # GITHUB_REF_NAME is the pushed tag, which avoids interpolating an
      # expression into the script body. `gh` exits non-zero when an asset path
      # does not exist, which preserves the previous
      # fail_on_unmatched_files behaviour, and --verify-tag aborts rather than
      # creating a tag if this workflow is ever triggered without one.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            main.js \
            manifest.json \
            styles.css
